apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  parentRefs:
    - {name: eg, namespace: gateway-system}
  hostnames: ["argocd.hub.localtest.me"]
  rules:
    - backendRefs:
        - {name: argocd-server, port: 80}
