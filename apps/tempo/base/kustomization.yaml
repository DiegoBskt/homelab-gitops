# Tempo (un solo binario) -> observability. Chart en grafana-community, version fijada.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
labels:
  - pairs: {app.kubernetes.io/part-of: homelab}
    includeSelectors: false
helmCharts:
  - name: tempo
    repo: oci://ghcr.io/grafana-community/helm-charts
    version: 3.2.1
    releaseName: tempo
    namespace: observability
    valuesFile: values.yaml
