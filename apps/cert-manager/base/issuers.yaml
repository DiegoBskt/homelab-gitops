# Cadena de emision local (contrato, seccion 8): selfsigned -> CA raiz (isCA) -> ClusterIssuer 'local-ca'.
# Los CRs dependen de los CRDs del chart (ola 0), por eso van en olas posteriores.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  labels: {app.kubernetes.io/part-of: homelab}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca-root
  namespace: cert-manager   # namespace de recursos de cluster de cert-manager (Secret de la CA)
  labels: {app.kubernetes.io/part-of: homelab}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  isCA: true
  commonName: homelab-local-ca
  subject: {organizations: [homelab]}
  secretName: local-ca-root   # contiene tls.crt (CA publica), tls.key y ca.crt
  duration: 87600h            # 10 años
  renewBefore: 8760h          # renovar 1 año antes
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Never}
  issuerRef: {name: selfsigned, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca
  labels: {app.kubernetes.io/part-of: homelab}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  ca:
    secretName: local-ca-root
