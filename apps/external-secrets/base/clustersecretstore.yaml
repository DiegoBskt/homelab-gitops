# Store global hacia OpenBao (KV v2 en 'kv'), autenticado con Kubernetes auth (rol 'eso').
# Mientras OpenBao no este inicializado/configurado (gate manual) el store aparece no Ready; es esperado.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels: {app.kubernetes.io/part-of: homelab}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
