apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - gateway.yaml
helmCharts:
  - name: gateway-helm
    repo: oci://registry-1.docker.io/envoyproxy
    version: v1.9.3
    releaseName: eg
    namespace: envoy-gateway-system
    includeCRDs: true
    valuesInline:
      deployment:
        envoyGateway:
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
