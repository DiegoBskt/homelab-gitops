# Service con el nombre y puerto que exige el contrato (seccion 5): seaweedfs-s3.storage:8333.
# El chart solo publica `seaweedfs-all-in-one` (con todos los puertos); este Service adicional
# apunta al mismo pod y expone unicamente el S3.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs-s3
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  ports:
    - name: swfs-s3
      port: 8333
      targetPort: 8333
      protocol: TCP
  # Mismo selector que el Service `seaweedfs-all-in-one` del chart (release `seaweedfs`).
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs
    app.kubernetes.io/component: seaweedfs-all-in-one
