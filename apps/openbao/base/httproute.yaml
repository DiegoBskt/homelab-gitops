# UI de OpenBao: https://openbao.hub.localtest.me (sin sectionName: atacha a http y https).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: openbao
  labels: {app.kubernetes.io/part-of: homelab}
