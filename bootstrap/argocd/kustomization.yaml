# Argo CD instalado con Kustomize desde el manifiesto oficial, version fijada.
# Se aplica una sola vez a mano (ver bootstrap/README.md); despues se gestiona a si mismo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.7/manifests/install.yaml
patches:
  - path: patches/argocd-cm.yaml
  - path: patches/argocd-cmd-params-cm.yaml
