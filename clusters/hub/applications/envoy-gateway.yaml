apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  project: platform
  source:
    repoURL: https://github.com/DiegoBskt/homelab-gitops.git
    targetRevision: main
    path: apps/envoy-gateway/overlays/hub
  destination: {server: https://kubernetes.default.svc, namespace: envoy-gateway-system}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
