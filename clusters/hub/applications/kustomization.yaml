# Una Application por componente. Ver apps/README.md y docs/contract.md (olas de sincronizacion).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - envoy-gateway.yaml
  - argocd.yaml
  # --- fase 4, ola 0-1: emision de certificados y secretos (OpenBao requiere init/unseal manual) ---
  - cert-manager.yaml
  - external-secrets.yaml
  - openbao.yaml
  - platform-secrets.yaml
  # --- fase 4, ola 2: almacenamiento de objetos S3 ---
  - seaweedfs.yaml
  # --- fase 4, ola 3: metricas, logs y trazas ---
  - mimir.yaml
  - loki.yaml
  - tempo.yaml
  # --- fase 4, ola 4: recoleccion de telemetria y Grafana ---
  - otel-collector.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - grafana.yaml
  # --- fase 4, ola 5: consola web y UI de Hubble ---
  - headlamp.yaml
  - hubble-route.yaml
