apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  project: platform
  source:
    repoURL: https://github.com/DiegoBskt/homelab-gitops.git
    targetRevision: main
    path: apps/openbao/overlays/hub
  destination: {server: https://kubernetes.default.svc, namespace: openbao}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
