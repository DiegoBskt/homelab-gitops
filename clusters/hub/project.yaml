apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Plataforma del homelab (gestionada desde este repo)
  sourceRepos:
    - https://github.com/DiegoBskt/homelab-gitops.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: "*"}
  clusterResourceWhitelist:
    - {group: "*", kind: "*"}
