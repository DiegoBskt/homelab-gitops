name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar herramientas (versiones fijadas en tools/versions.env)
        run: FORCE=1 scripts/install-tools.sh
      - name: Validar
        run: scripts/validate.sh
      - name: Verificar el contrato de interfaces
        run: scripts/check-contract.sh
